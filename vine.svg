<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 360" width="72" height="360" fill="none">
  <defs>
    <g id="leaf">
      <path d="M0 0 C 7 -11, 16 -18, 26 -20 C 14 -8, 8 4, 0 14 C -1 6, -1 2, 0 0 Z" stroke="#2c2a24" stroke-width="0.85" stroke-linejoin="round"/>
      <path d="M2 -1 C 8 -8, 15 -14, 23 -17" stroke="#2c2a24" stroke-width="0.45"/>
      <path d="M3 1 L 12 -8" stroke="#2c2a24" stroke-width="0.35"/>
      <path d="M4 4 L 11 -3" stroke="#2c2a24" stroke-width="0.35"/>
      <path d="M3 7 L 8 1" stroke="#2c2a24" stroke-width="0.35"/>
    </g>
    <g id="leaf-sm">
      <path d="M0 0 C 5 -8, 11 -12, 18 -13 C 10 -5, 5 3, 0 10 C -0.6 4, -0.5 1, 0 0 Z" stroke="#2c2a24" stroke-width="0.8" stroke-linejoin="round"/>
      <path d="M1.5 0 C 6 -5, 11 -9, 16 -11" stroke="#2c2a24" stroke-width="0.4"/>
      <path d="M2 2 L 8 -4" stroke="#2c2a24" stroke-width="0.3"/>
      <path d="M2.5 5 L 7 0" stroke="#2c2a24" stroke-width="0.3"/>
    </g>
    <g id="knots">
      <circle cx="0" cy="0" r="1.55" fill="#2c2a24"/>
      <circle cx="3.4" cy="-1.6" r="1.25" fill="#2c2a24"/>
      <circle cx="3.1" cy="1.8" r="1.2" fill="#2c2a24"/>
      <circle cx="0" cy="0" r="0.45" fill="#f6f3ec"/>
    </g>
    <g id="flower">
      <path d="M0 -5.2 C 1.4 -2.4, 1.4 2.4, 0 5.2 C -1.4 2.4, -1.4 -2.4, 0 -5.2 Z" stroke="#2c2a24" stroke-width="0.7" fill="none"/>
      <path d="M-5.2 0 C -2.4 -1.4, 2.4 -1.4, 5.2 0 C 2.4 1.4, -2.4 1.4, -5.2 0 Z" stroke="#2c2a24" stroke-width="0.7" fill="none"/>
      <path d="M-3.7 -3.7 C -1.1 -1.8, 1.8 1.1, 3.7 3.7 C 1.8 1.1, -1.1 -1.8, -3.7 -3.7 Z" stroke="#2c2a24" stroke-width="0.55" fill="none"/>
      <path d="M3.7 -3.7 C 1.8 -1.1, -1.1 1.8, -3.7 3.7 C -1.8 1.1, 1.1 -1.8, 3.7 -3.7 Z" stroke="#2c2a24" stroke-width="0.55" fill="none"/>
      <circle cx="0" cy="0" r="1.35" fill="#2c2a24"/>
      <circle cx="0" cy="0" r="0.4" fill="#f6f3ec"/>
    </g>
    <g id="curl">
      <path d="M0 0 C 4 -1, 7 2, 6 6 C 5 10, 0 10, -1 6 C -2 3, 1 2, 3 4" stroke="#2c2a24" stroke-width="0.75" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- tileable stem: same x and downward tangent at 0 and 360 -->
  <path d="M36 0
           C36 28, 22 42, 20 72
           C18 104, 40 118, 46 148
           C52 178, 28 196, 22 228
           C16 260, 34 286, 36 320
           C36 338, 36 350, 36 360"
        stroke="#2c2a24" stroke-width="1.35" stroke-linecap="round"/>
  <path d="M38.1 0
           C38.1 28, 24.2 43, 22.2 73
           C20.3 104, 41.8 119, 47.6 149
           C53.4 178, 30 196, 24.1 228
           C18.2 260, 36.1 286, 38.1 320
           C38.1 338, 38.1 350, 38.1 360"
        stroke="#2c2a24" stroke-width="0.38" opacity="0.55"/>

  <use href="#leaf" transform="translate(22 58) rotate(-18)"/>
  <use href="#leaf-sm" transform="translate(48 86) rotate(158)"/>
  <use href="#curl" transform="translate(16 96) rotate(-20) scale(0.95)"/>
  <use href="#knots" transform="translate(49 118)"/>
  <use href="#leaf" transform="translate(50 152) rotate(162)"/>
  <use href="#flower" transform="translate(24 176)"/>
  <use href="#leaf-sm" transform="translate(18 208) rotate(-28)"/>
  <use href="#curl" transform="translate(50 214) rotate(155) scale(0.9)"/>
  <use href="#knots" transform="translate(17 246)"/>
  <use href="#leaf" transform="translate(48 268) rotate(150)"/>
  <use href="#leaf-sm" transform="translate(22 308) rotate(-12)"/>
  <use href="#flower" transform="translate(50 332) scale(0.86)"/>
</svg>
