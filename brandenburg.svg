<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 78 460" width="78" height="460" fill="none">
  <defs>
    <g id="tor" stroke="#1c1b18" fill="none" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke">
      <!-- Quadriga: Victoria with the wreath, horses to either side -->
      <circle cx="35" cy="2.6" r="1.7" stroke-width="1.05"/>
      <path d="M35 4.3 V8.6" stroke-width="1.05"/>
      <path d="M35 6.2 L32.4 4.4" stroke-width="1"/>
      <path d="M33.2 8.6 L31.2 11.4 M36.8 8.6 L38.8 11.4" stroke-width="1"/>
      <path d="M24.2 12.6 C24.6 9.2 27.4 8.6 28.6 10.4 C29.2 8.2 32.2 8.4 32.4 11.8" stroke-width="1.1"/>
      <path d="M24.2 11.4 L22.6 10.2 L23.2 12.2" stroke-width="1"/>
      <path d="M26.4 12.2 V14.2 M29.6 12.2 V14.2" stroke-width="0.9"/>
      <path d="M37.6 11.8 C37.8 8.4 40.8 8.2 41.4 10.4 C42.6 8.6 45.4 9.2 45.8 12.6" stroke-width="1.1"/>
      <path d="M45.8 11.4 L47.4 10.2 L46.8 12.2" stroke-width="1"/>
      <path d="M40.4 12.2 V14.2 M43.6 12.2 V14.2" stroke-width="0.9"/>
      <path d="M21 14.2 H49 V17.2 H21 Z" stroke-width="1.2"/>
      <!-- cornice, wider than the attic, with the turned ends -->
      <path d="M16 17.2 H54 L58 20.4 H12 L16 17.2" stroke-width="1.25"/>
      <path d="M8 20.4 H62 V24.6 H8 Z" stroke-width="1.3"/>
      <path d="M8 22.5 H62" stroke-width="1"/>
      <!-- six columns -->
      <rect x="9.2" y="24.6" width="5.6" height="24" stroke-width="1.3"/>
      <rect x="18.6" y="24.6" width="5.6" height="24" stroke-width="1.3"/>
      <rect x="28" y="24.6" width="5.6" height="24" stroke-width="1.3"/>
      <rect x="37.4" y="24.6" width="5.6" height="24" stroke-width="1.3"/>
      <rect x="46.8" y="24.6" width="5.6" height="24" stroke-width="1.3"/>
      <rect x="56.2" y="24.6" width="5.6" height="24" stroke-width="1.3"/>
    </g>
  </defs>
  <!-- facing you, as on the pane straight ahead -->
  <use href="#tor" transform="translate(4 2)"/>
  <!-- the pane turning away to the left -->
  <use href="#tor" transform="translate(46 78) scale(0.86) skewX(-28) translate(-35 -8)"/>
  <!-- the same mark on its side, quadriga toward the platform -->
  <use href="#tor" transform="translate(39 196) rotate(90) translate(-35 -26)"/>
  <!-- the pane turning away to the right -->
  <use href="#tor" transform="translate(32 250) scale(0.86) skewX(28) translate(-35 -8)"/>
  <!-- on its side the other way -->
  <use href="#tor" transform="translate(39 368) rotate(-90) translate(-35 -26)"/>
</svg>
